<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drift</title>
    <style>
        @font-face {
            font-family: 'DM sans';
            src: url("fonts/DMSans.ttf") format("truetype");
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'DM sans', sans-serif;
            user-select: none;
        }
        body{
            height: 100vh;
            overflow-y: auto;
            background-color: #e8dcc8;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #con{
            display: flex;
            width: 50%;
            align-content: flex-start;
            justify-content: center;
            flex: 1;
            flex-wrap: wrap;
            gap: 10px;
            min-width: 450px;
        }
        .level{
            background-color: #d6ba89;
            border: 2px solid #5A4635;
            width: 100px;
            height: 100px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.1s;
            position: relative;
            overflow: hidden;
        }
        .level.locked{
            pointer-events: none;
        }
        .level.locked:after{
            content: "";
            width: 100%;
            height: 100%;
            position: absolute;
            background-image: url("assets/Lock.svg");
            background-repeat: no-repeat;
            background-size: 80% 80%;
            background-position: center;
            background-color: #d6ba89;
        }
        .level:hover{
            background-color: #c0a16c;
        }
        #logo{
            font-size: 100px;
            font-weight: 600;
            padding: 30px;
        }
    </style>
</head>
<body>
    <div id="logo">Drift</div>
    <div id="con">

    </div>
    <script>
        var levels_count = 10
        var level = localStorage.getItem("level")
        if (!level) {
            localStorage.setItem("level", "1")
            var level = localStorage.getItem("level")
        }
        for (let i = 1; i <= levels_count; i++) {
            var element = document.createElement("div")
            element.id = "level" + i
            element.classList.add("level")
            element.innerHTML = i
            element.onclick = function () {
                window.location.href = `play.html?level=${i}`
            }
            if (i > level) {
                element.classList.add("locked")
            }
            document.querySelector("#con").appendChild(element)
        }
    </script>
</body>
</html>
